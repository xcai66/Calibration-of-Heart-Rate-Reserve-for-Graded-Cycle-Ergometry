<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #1F2937; }
    .title { font-size: 42px; font-weight: 700; }
    .subtitle { font-size: 23px; fill: #6B7280; }
    .axis { font-size: 20px; fill: #6B7280; }
    .label { font-size: 23px; }
    .small { font-size: 19px; fill: #6B7280; }
  </style>
  <text class="title" x="90" y="72">Construction of the public-data development sample</text>
  <text class="subtitle" x="90" y="112">Sequential linkage, uniqueness, heart-rate quality control, and analysis eligibility</text>
  <rect x="250" y="165" width="1100" height="100" rx="18" fill="#F4F7FA" stroke="#D1D5DB" stroke-width="3"/>
  <text x="305" y="228" font-size="38" font-weight="700" fill="#17365D">783</text>
  <text x="480" y="226" class="label">RPE records in PMData</text><line x1="800" y1="265" x2="800" y2="305" stroke="#6B7280" stroke-width="3"/><polygon points="790,297 810,297 800,313" fill="#6B7280"/><text x="835" y="296" class="small">314 records not linked to a tracker session</text><rect x="250" y="329" width="1100" height="100" rx="18" fill="#F4F7FA" stroke="#D1D5DB" stroke-width="3"/>
  <text x="305" y="392" font-size="38" font-weight="700" fill="#17365D">469</text>
  <text x="480" y="390" class="label">RPE records matched to tracker sessions</text><line x1="800" y1="429" x2="800" y2="469" stroke="#6B7280" stroke-width="3"/><polygon points="790,461 810,461 800,477" fill="#6B7280"/><text x="835" y="460" class="small">22 matches not bidirectionally unique</text><rect x="250" y="493" width="1100" height="100" rx="18" fill="#F4F7FA" stroke="#D1D5DB" stroke-width="3"/>
  <text x="305" y="556" font-size="38" font-weight="700" fill="#17365D">447</text>
  <text x="480" y="554" class="label">Unique bidirectional matches</text><line x1="800" y1="593" x2="800" y2="633" stroke="#6B7280" stroke-width="3"/><polygon points="790,625 810,625 800,641" fill="#6B7280"/><text x="835" y="624" class="small">180 unique matches failed heart-rate quality control</text><rect x="250" y="657" width="1100" height="100" rx="18" fill="#F4F7FA" stroke="#D1D5DB" stroke-width="3"/>
  <text x="305" y="720" font-size="38" font-weight="700" fill="#17365D">267</text>
  <text x="480" y="718" class="label">Unique matches passing heart-rate quality control</text><line x1="800" y1="757" x2="800" y2="797" stroke="#6B7280" stroke-width="3"/><polygon points="790,789 810,789 800,805" fill="#6B7280"/><text x="835" y="788" class="small">12 sessions failed remaining primary criteria</text><rect x="250" y="821" width="1100" height="100" rx="18" fill="#D9F0F2" stroke="#007C91" stroke-width="3"/>
  <text x="305" y="884" font-size="38" font-weight="700" fill="#17365D">255</text>
  <text x="480" y="882" class="label">Primary analysis sessions from 15 participants</text><rect x="280" y="1010" width="480" height="100" rx="16" fill="#FFFFFF" stroke="#17365D" stroke-width="3"/>
<text x="520" y="1050" text-anchor="middle" font-size="30" font-weight="700">Nested prediction</text>
<text x="520" y="1087" text-anchor="middle" class="small">255 sessions; 15 held-out participant folds</text>
<rect x="840" y="1010" width="480" height="100" rx="16" fill="#FFFFFF" stroke="#17365D" stroke-width="3"/>
<text x="1080" y="1050" text-anchor="middle" font-size="30" font-weight="700">Within-person association</text>
<text x="1080" y="1087" text-anchor="middle" class="small">244 sessions; 9 participants with ≥5 sessions</text>
</svg>